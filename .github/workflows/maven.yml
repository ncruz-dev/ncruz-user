# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  pull_request:
    branches: [ "main" ]
    types: [closed]

concurrency:
  group: docker-build
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 👇 Creamos la variable corta de GithubSha para usarla en el tag de la imagen y evitar que sea demasiado larga
    - name: Set short SHA
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

    # 👇 Mejora performance + cacheo de dependencias
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 👇 No es necesario, porque DockerFile ya lo hace
#    - name: Set up JDK 21
#      uses: actions/setup-java@v4
#      with:
#        java-version: '21'
#        distribution: 'temurin'
#        cache: maven
#    - name: Build with Maven
#      run: mvn clean install

    # 👇 LOGIN OBLIGATORIO PARA PODER HACER PUSH A DOCKER HUB
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 👇 BUILD & PUSH DE LA IMAGEN A DOCKER HUB
    - name: Build & push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          docker.io/${{ secrets.DOCKER_USERNAME }}/api-ncruz-user:${{ github.run_number }}-${{ env.SHORT_SHA }}
          docker.io/${{ secrets.DOCKER_USERNAME }}/api-ncruz-user:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

      #Escaneo de vulnerabilidades con Trivy
    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.DOCKER_USERNAME }}/api-ncruz-user:${{ github.run_number }}-${{ env.SHORT_SHA }}

